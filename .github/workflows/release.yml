# Builds Talyxel Sound for Windows, macOS and Linux when a version tag (v*) is pushed,
# and attaches archives named the way the built-in updater (self_update) expects:
#   talyxel-sound-<tag>-<target>.zip|tar.gz  containing the `talyxel` binary at the root.
# Pull requests that change the build setup run the same builds and checks without publishing.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-26-intel, target: x86_64-apple-darwin, ext: tar.gz }
          # Oldest supported Ubuntu, so the binary runs on any distro with glibc 2.35 or newer.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The updater compares the release tag with the version compiled into the app, so a
      # mismatch would offer the same update forever.
      - name: Check the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml. Tag the release v$version instead."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Test
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Check runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.target }}/release/talyxel"
          ldd "$bin"
          if ldd "$bin" | grep -E 'lib(ssl|crypto|dbus)'; then
            echo "::error::talyxel links a system library users would have to install"
            exit 1
          fi
      - name: Check runtime dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /nologo /dependents "target/${{ matrix.target }}/release/talyxel.exe"
          $deps
          if ($deps -match 'vcruntime|msvcp') {
            Write-Error "talyxel.exe needs the Visual C++ Redistributable; is crt-static set in .cargo/config.toml?"
          }
      - name: Package (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $name = "talyxel-sound-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/talyxel.exe" -DestinationPath $name
          echo "ASSET=$name" >> $env:GITHUB_ENV
      - name: Package (Unix)
        if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/')
        run: |
          name="talyxel-sound-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$name" -C "target/${{ matrix.target }}/release" talyxel
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}
