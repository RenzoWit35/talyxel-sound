[package]
name = "talyxel-sound"
version = "0.1.0"
edition = "2024"
description = "Talyxel Sound — a terminal Spotify client and Spotify Connect device"
license = "MIT"
repository = "https://github.com/your-github-user/talyxel-sound"

[[bin]]
name = "talyxel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
keyring = "4.2.0"
librespot-connect = "0.8.0"
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = "0.8.0"
librespot-protocol = "0.8.0"
ratatui = "0.30.2"
rspotify = { version = "0.16.1", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
rustfft = "6.4.1"
self_update = { version = "1.3.0", default-features = false, features = ["github", "archive-zip", "archive-tar", "compression-tar-gz", "compression-zip-deflate", "rustls", "reqwest"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
